name: Go

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # actions/checkout@v4.2.2
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

    # actions/setup-go@v5.3.0
    - name: Set up Go
      uses: actions/setup-go@34829cb9acb0c3aab260216f67d0867cc080dca5
      with:
        go-version-file: 'go.mod'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
