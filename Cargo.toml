[package]
name = "multipurpose-discord-bot"
version = "0.1.0"
edition = "2024"
description = "Rust reimplementation of the sspu-verifier Discord bot"
license = "AGPL-3.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI + env
clap = { version = "4", features = ["derive", "env"] }

# Parsing
regex = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Session 2: SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# Session 3: HTTP client (Resend API, Discord CDN downloads)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Session 4: crypto
sha2 = "0.10"
rand = "0.9"
subtle = "2"

# Session 4: CSV parsing (/csv upload)
csv = "1"

# Session 5: Discord gateway + command framework
serenity = "0.12"
poise = "0.6"

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
